# 持续集成：开源后每个 PR 必须过的三道闸。
#
# 三个 job 各自独立，任何一个红都不阻塞另外两个——但合并前要求全绿：
#   1. backend  ：后端 pytest（Windows 跑，因为写侧沙箱与命令相关用例只对 Windows 有意义）
#   2. frontend ：前端类型检查 + lint + 单测 + 生产构建
#   3. secrets  ：密钥扫描（规则见仓库根的 .gitleaks.toml）
#
# 前端单测（vitest）已进 CI（2026-10-26）：之前那次"挂起"是本地执行环境把进程判成常驻服务，
# 不是 vitest 本身的问题——`vitest run` 在无头环境里 26 秒跑完 587 条。

name: CI

on:
  push:
    # 同时写 main 与 master：本地当前主分支是 master（Gitee 上的远端也是它），
    # 将来迁到 GitHub 时大概率会被改成 main。两个都列上，避免"推上去了但 CI 一直不跑"。
    branches: [main, master]
  pull_request:

# 只读权限：CI 不需要写仓库（发布走单独的 release workflow）
permissions:
  contents: read

# 同一分支的旧跑批直接取消，省 runner 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / pytest
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # runner 是 en-US locale：Python 默认 cp1252，pytest 打印中文断言信息会 UnicodeEncodeError。
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: local-agent-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: local-agent-web/pyproject.toml

      - name: 安装依赖（含 memory 可选组）
        # `requirements.txt` 只有一行 `-e .`，开发依赖在 pyproject 的 dependency-groups 里；
        # memory 组（chromadb / fastembed）必须装：不装的话 tests/test_memory.py 会跳过一整组用例，
        # 那等于"记忆系统的回归在 CI 里看不见"。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[memory]" pytest pytest-asyncio ruff

      - name: 环境诊断
        shell: pwsh
        # "本地全绿、CI 全红"这类差异必须先拿到事实再动代码（2026-11-05）：
        # 平台、编码、沙箱可用性、ruff 是否安装，决定了大批用例能不能跑。
        run: |
          python -V
          python -c "import sys, locale; print('platform=', sys.platform, 'fsenc=', sys.getfilesystemencoding(), 'pref=', locale.getpreferredencoding(False))"
          python -c "from local_agent.security import win_sandbox as w; print('kernel32=', w._kernel32 is not None, 'supported=', w.is_supported())"
          python -c "import importlib.util as u; print('ruff=', u.find_spec('ruff') is not None)"
          whoami

      - name: 跑全部后端用例
        shell: pwsh
        # 失败摘要写进 job summary（2026-11-05）：默认日志要仓库权限才能下载，摘要区
        # 在 Actions 首页就能看，省掉"再找维护者要日志"这一跳。
        run: |
          python -m pytest -q -rf 2>&1 | Tee-Object -FilePath pytest.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## pytest 失败摘要"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            Get-Content pytest.log |
              Select-String -Pattern '^(FAILED|ERROR)' |
              ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_.Line }
            # 同时走 annotation：它可以通过公开 API 读到（摘要区不能），失败清单不必再靠人工贴日志。
            Get-Content pytest.log |
              Select-String -Pattern '^(FAILED|ERROR)' |
              Select-Object -First 10 |
              ForEach-Object { Write-Host "::error::$($_.Line)" }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          }
          exit $code

      - name: 沙箱冒烟（真实机器上确认写边界物化出来了）
        # 单测测的是"我们打算怎么做"，这一步测的是"这台机器的内核真的拦不拦"。
        # 沙箱装错时前者往往是绿的，所以它必须是独立的一步（参照实现同样单开脚本）。
        run: python scripts/sandbox_smoke.py

  frontend:
    name: frontend / typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: local-agent-web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: local-agent-web/frontend/package-lock.json

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: lint
        run: npx eslint .

      - name: 单元测试
        run: npm test

      - name: 生产构建（确认产物能打出来）
        run: npm run build

  sandbox-smoke:
    name: sandbox / smoke (${{ matrix.os }})
    # 三平台都跑：Windows 上验"受限令牌真的物化出写边界"，Linux/macOS 上目前如实 SKIP（尚未实现
    # OS 级边界）。等 bwrap / seatbelt 落地后，这一步就是它们的回归闸门——不需要再改工作流。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # 与 backend 同一口径：runner 是 en-US locale，Python 默认 cp1252，打印中文会
      # UnicodeEncodeError（脚本自己也会 reconfigure，这里是第二道保险）。
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: local-agent-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: local-agent-web/pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 装 bubblewrap（Linux 才有意义）
        # 装上它冒烟才会走"真实写探针"而不是 SKIP——不装就等于这一步白跑。
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: 环境诊断
        shell: bash
        # 沙箱冒烟失败时，"哪条后端可用、依赖在不在"比冒烟本身的输出更有用：
        # 三个平台的失败原因完全不同（Windows 看受限令牌，Linux 看 bwrap/unshare，macOS 看 sandbox-exec）。
        run: |
          python -V
          python - <<'PY' || true
          from local_agent.security import posix_sandbox
          print("posix.available =", posix_sandbox.available())
          print("posix.backend   =", posix_sandbox.backend())
          print("posix.reason    =", posix_sandbox.unavailable_reason())
          PY
          command -v bwrap || echo "bwrap: 不在 PATH"
          command -v sandbox-exec || echo "sandbox-exec: 不在 PATH"

      - name: 冒烟
        shell: bash
        # 三平台共用 bash 是为了拿到 PIPESTATUS（pwsh 的 $LASTEXITCODE 在管道后不可靠），
        # 同时把最后 40 行写进 job summary——冒烟失败时那几行就是全部证据。
        run: |
          set +e
          python scripts/sandbox_smoke.py 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            {
              echo "## 沙箱冒烟失败（${{ matrix.os }}）"
              echo '```'
              tail -40 smoke.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # annotation 可以被公开 API 读到：失败的最后 10 行就是定位所需的全部证据。
            tail -10 smoke.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
          fi
          exit "$code"

  portability:
    name: portability / pytest (${{ matrix.os }})
    # **观察期**（2026-11-02 起）：Linux / macOS 的完整后端用例还没在 CI 里跑过，先收集信号，
    # `continue-on-error` 让它红也不阻塞合并。等它连绿三轮，把这一行删掉即可变成必需闸门——
    # 不要反过来做（先设必需再常年红，等于训练所有人忽略 CI）。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: local-agent-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: local-agent-web/pyproject.toml
      - name: 安装依赖（含 memory 可选组，与 Windows job 同口径）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[memory]" pytest pytest-asyncio ruff
      - name: 跑后端用例（先看现状，不加 --maxfail）
        shell: bash
        run: |
          set +e
          python -m pytest -q -rf 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            {
              echo "## pytest 失败摘要（${{ matrix.os }}）"
              echo '```'
              grep -E '^(FAILED|ERROR)' pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(FAILED|ERROR)' pytest.log | head -10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$code"

  secrets:
    name: secrets / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 扫描整段历史，而不只是本次 diff：历史里曾经提交过的密钥同样要能发现
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
