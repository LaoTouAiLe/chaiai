# 密钥扫描规则（gitleaks）。
#
# 为什么需要文件而不是纯默认规则：本仓库的测试与文档里有大量**形状像密钥的占位符**
# （`sk-EXAMPLE-not-a-real-key` 一类），它们是"用来验证脱敏行为"的夹具。默认规则会把它们
# 当成真实泄露，于是 CI 每次都红，久而久之大家就会忽略这条检查——那比没有检查更糟。
#
# 因此这里只放宽到"测试、文档与示例文件"这三类路径；`src/` 与 `frontend/src/` 仍按默认规则扫描，
# 真实凭据写进代码依然会被拦住。

title = "chaiai gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "测试夹具 / 文档示例 / 样例配置里的假密钥"
paths = [
  '''local-agent-web/tests/.*''',
  '''local-agent-web/frontend/src/.*\.test\.tsx?''',
  '''local-agent-web/frontend/e2e/.*''',
  '''local-agent-web/docs/.*''',
  '''docs/.*''',
  '''.*\.example''',
  '''.*\.md''',
]

# 兼容性基线里的哈希不是凭据（2026-11-03，2026-11-06 修正拦截方式）。
#
# `generic-api-key` 只看"字段名像 key + 值熵高"，于是把
#
#     "openapi_sha256": "…64 位十六进制…"
#
# 判成泄露。这个**不能靠改字段名解决**：它是基线契约的一部分，改名等于基线失效。
#
# 2026-11-06 更正：原来写成"路径 + regexTarget=match + 带字段名的正则"，实际拦不住——
# `match` 目标是被判成密钥的那段文本（只有 64 位哈希，不含字段名），正则永远匹配不上，
# 于是 v0.3.1 推送时 CI 第一次真的报红。现在改成**路径级放行**：该文件由
# `scripts/check_release_contracts.py --write` 生成，只含版本号与三个 sha256，没有任何凭据。
[[allowlists]]
description = "compatibility-baseline.json 只含版本号与哈希，不含凭据"
paths = ['''docs/release/compatibility-baseline\.json''']
