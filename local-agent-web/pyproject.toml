[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-web"
version = "0.3.0"
description = "Local learning-oriented web Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4"
dependencies = [
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "streamlit",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "python-dotenv",
  "filelock",
  # v0.6 T63：`.gitignore` 语义不自己实现——`pathspec` 是 Python 侧的参考实现（black / pre-commit 用它），
  # 检索遍历据此跳过"被 git 忽略的产物目录"（与 ripgrep 的默认一致）。它本来就在依赖图里（传递依赖），
  # 这里只是**显式声明**我们在直接用它。
  "pathspec>=1.0,<2",
  "fastapi>=0.141.1",
  "uvicorn>=0.52.4",
  "websockets>=16,<17",
  "keyring>=25.7.0",
  "websocket-client>=1.8,<2",
  "mcp>=2.3.0",
  "send2trash>=2.1.0",
  "croniter>=6.2.4",
  "trafilatura>=2.0,<3",
  # 文档上传（2026-10-29）：`POST /sessions/{id}/files` 用 multipart 接收几十 MB 的
  # pdf/docx。图片仍走 base64 JSON——那份 2 MB 上限下 33% 的开销无所谓，文档则不是。
  "python-multipart>=0.0.20,<1",
  # 文档提取（2026-10-29）：`read_file` 直接读 docx / xlsx / pptx / pdf。
  # 为什么不学 hermes 用 firecrawl-anydoc：它要求 python_version >= 3.14，我们声明 >=3.10；
  # 而且它要进 PyInstaller 目录包，能否被正确收集没有验证过。这四个都是纯 Python 或
  # 只依赖 lxml（环境里本来就有，python-pptx 会带进 Pillow/XlsxWriter）。
  # 版本按 2026-10-29 实测通过的具体版本锁定上界：解析行为与输出格式都被用例按现状约束。
  "pypdf>=6.21.4,<7",
  "python-docx>=1.2.0,<2",
  "openpyxl>=3.1.5,<4",
  "python-pptx>=1.0.2,<2",
  # 截屏（2026-11-04）：`screenshot` 用 Pillow 的 `ImageGrab` 抓前台窗口并缩放到 JPEG。
  # 它本来是 python-pptx 的传递依赖（本机实测 12.3.0），这里显式声明：直接用它就该自己说了算，
  # 否则 python-pptx 换实现时会被动地"少一个包"。纯 ctypes 自研方案实测产出大近 5 倍，不用。
  "pillow>=11,<13",
  # 移动网关（2026-11-03，架构 §24）：反代要一条能流式读响应的 HTTP 客户端，
  # 标准库 urllib 做不到"逐块取、边收边发"。它原来只在 dev 组里（测试客户端用），
  # 移到运行时依赖后 dev 组不再需要单独声明。
  "httpx>=0.28.1,<1",
  # 局域网通道的自签 CA 与服务器证书（架构 §24）。它本来是 keyring 的传递依赖，
  # 这里显式声明：直接用它就该自己说了算，否则 keyring 换实现时会被动地"少一个包"。
  "cryptography>=46,<51",
  # 配对二维码（架构 §24）：纯 Python 生成，不依赖 Pillow；终端与 SVG 两种输出都用它。
  "qrcode>=8,<9",
  # 读界面控件树（2026-11-04）：`read_ui` 用它枚举前台窗口的 UIA 控件。
  # 为什么不自己写 ctypes COM：UIA 的 vtable 手写不现实，而这套是纯 Python + comtypes，
  # 本机实测 Python 3.13 可用（uiautomation 2.0.29 / comtypes 1.4.17），取一次 300 节点约 0.3 秒。
  # **只在 Windows 上真正使用**：`screen_uia.available()` 会先判平台，非 Windows 直接说不可用。
  # PyInstaller 侧需要 hidden-import（comtypes 动态生成模块），打包验收时一并确认。
  "uiautomation>=2.0.29,<3",
]

[project.optional-dependencies]
# memory：中期向量记忆（T14A 起含本地 ONNX Embedding 的 FastEmbed）。
# chromadb 按小版本锁定：实现依赖 1.5.9 实测到的具体行为（`hnsw:space` 元数据键、自定义 EF
# 必须有 `name()` 且 `__call__` 参数名必须是 `input`、get_or_create_collection 不覆盖已有
# metadata、维度校验时机），换小版本必须重新核实。
# fastembed 同理：它还是 0.x，构造参数（cache_dir / local_files_only / 模型元数据）在 0.8 上核实。
memory = ["chromadb>=1.5,<1.6", "tiktoken", "fastembed>=0.8,<0.9"]
# desktop：打包形态的窗口（WebView2）。Windows 上依赖系统自带的 WebView2 运行时（Win10/11 默认有）；
# 没装这一组时入口自动退回外部浏览器，不会起不来。
desktop = ["pywebview>=6,<7"]
# 按需代码检索（T21）不新增 Python 运行依赖：优先调用外部 `rg`（可选加速器，不由 uv 安装），
# 缺失时退化为有界 Python 扫描。局部 AST 若经实测加入，再单独开一个可选组。

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_agent = ["native/windows/*.c", "native/windows/*.h", "native/windows/bin/*.dll",
               "native/windows/bin/*.exe", "native/windows/bin/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_resolution: 用例依赖真实的可执行文件解析结果（PATH / 文件系统），不使用稳定的解析替身",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
# 与运行/测试使用的解释器一致。项目声明支持 3.10+，但传递依赖 numpy 2.x 的类型存根
# 使用 PEP 695 语法（需 py3.12+），py3.10 目标下无法解析；语法层面的 3.10 兼容
# 由 ruff 的 target-version = "py310" 把关。
python_version = "3.13"
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# 无类型存根或会带进大量可选依赖的间接依赖，按 Any 处理：
# streamlit（带进 pandas/pyarrow 等）、yaml（无存根）、tiktoken（langchain-openai 的间接依赖）、
# chromadb 与 fastembed（可选依赖 memory extra，默认不装；memory/medium_term.py 与
# llm/embedding.py 都只做延迟导入）——只装基础依赖时 `mypy src` 也必须干净。
[[tool.mypy.overrides]]
module = [
  "streamlit",
  "streamlit.*",
  "yaml",
  "yaml.*",
  "tiktoken",
  "tiktoken.*",
  "chromadb",
  "chromadb.*",
  "fastembed",
  "fastembed.*",
  # 系统回收站（2026-10-21）：库本身没有类型存根，`types-Send2Trash` 也没覆盖它的
  # 异常导出；这里跳过它，调用点自己把异常收敛成 `FileOperationError`。
  "send2trash",
  "send2trash.*",
  # 定时任务（2026-10-26）：croniter 不自带类型存根，call site 只用了 `is_valid` / `get_next`，
  # 输入输出都是原始类型；为它单独引入 `types-croniter` 不值得。
  "croniter",
  "croniter.*",
  # 配对二维码（2026-11-03）：qrcode 没有类型存根，调用点只用了 QRCode 构造与 get_matrix，
  # 输入输出都是原始类型；为它装 types-qrcode（并不存在）不值得。
  "qrcode",
  "qrcode.*",
]
follow_imports = "skip"
ignore_missing_imports = true
